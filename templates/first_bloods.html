{% extends "base.html" %}

{% block content %}
<div class="jumbotron">
    <div class="container text-center">
        <h1>First Bloods</h1>
    </div>
</div>

<div class="container">
    <div class="row">
        <div class="col-md-12">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <td><b>Challenge</b></td>
                        <td><b>User</b></td>
                        <td><b>Team</b></td>
                        <td><b>Time Achieved</b></td>
                    </tr>
                </thead>
                <tbody>
                    {% for blood in bloods %}
                    <tr>
                        <td>{{ blood.challenge_name }}</td>
                        <td>{{ blood.user_name }}</td>
                        <td>{{ blood.team_name }}</td>
                        <td class="blood-time" data-time="{{ blood.date.isoformat() }}Z">
                            </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="4" class="text-center">No first bloods yet!</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Format UTC database times into the user's local timezone
    document.addEventListener("DOMContentLoaded", function() {
        const timeCells = document.querySelectorAll('.blood-time');
        timeCells.forEach(function(cell) {
            const utcTime = cell.getAttribute('data-time');
            if (utcTime && utcTime !== "NoneZ") {
                const dateObj = new Date(utcTime);
                cell.innerText = dateObj.toLocaleString();
            } else {
                cell.innerText = "Unknown Time";
            }
        });
    });
</script>
{% endblock %}
